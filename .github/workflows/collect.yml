name: collect-market-data
# Runs the Macro Futures Desk engine in the cloud after the US futures close and commits the results to data/.
# US futures sessions end at 5 PM ET and the data feed lags 10 minutes, so closes are final from 5:20 PM ET.
# GitHub starts scheduled jobs late (sometimes by hours) or drops them, so there are many start times:
# every 15 minutes from 5:22 PM ET to about midnight ET, then every 30 minutes around 4-8 AM ET (for the morning
# fallback). The times are in UTC and cover both EST and EDT. tools/clock.py skips a run when this evening's data
# (generated after the latest weekday 5:20 PM ET) is already in, so normally only the first successful slot works.
on:
  schedule:
    - cron: "7,22,37,52 21-23 * * 1-5"
    - cron: "7,22,37,52 0-4 * * 2-6"
    - cron: "7,37 8-12 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["engine/**", "runner/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Skip if this evening's closes are already in
        id: fresh
        if: github.event_name == 'schedule'
        run: python3 tools/clock.py --gate data/status.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: "20"
      - name: Install runner
        if: steps.fresh.outputs.skip != 'true'
        run: npm install --prefix runner --no-audit --no-fund
      - name: Run engine
        if: steps.fresh.outputs.skip != 'true'
        run: node runner/run_node.mjs --engine engine/mfd_engine.min.js --outdir data
        continue-on-error: true
      - name: Commit data
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "macro-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep this run's files; if another run pushed first, start from its commit and lay ours on top
          mkdir -p /tmp/out && cp -r data/. /tmp/out/
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main && git reset --hard --quiet origin/main
            mkdir -p data && cp -r /tmp/out/. data/
            git add data
            git diff --cached --quiet && exit 0
            git commit --quiet -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet && exit 0
            sleep 7
          done
          echo "push failed after 5 tries"; exit 1
